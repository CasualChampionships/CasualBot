[versions]
kotlin          = "2.4.10"
shadow          = "9.6.1"
coroutines      = "1.11.0"
json            = "1.11.0"
jda             = "6.5.0"
jda-ktx         = "0.15.0"
ktor            = "3.5.2"
klogging        = "8.0.4"
logback         = "1.6.3"
mojank          = "1.1.0"
casual-database = "0.3.2"

[libraries]
coroutines      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core"         , version.ref = "coroutines" }
json            = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json"      , version.ref = "json" }
properties      = { module = "org.jetbrains.kotlinx:kotlinx-serialization-properties", version.ref = "json" }
jda             = { module = "net.dv8tion:JDA"                                       , version.ref = "jda" }
jda-ktx         = { module = "club.minnced:jda-ktx"                                  , version.ref = "jda-ktx" }
klogging        = { module = "io.github.oshai:kotlin-logging-jvm"                    , version.ref = "klogging" }
logback         = { module = "ch.qos.logback:logback-classic"                        , version.ref = "logback" }
mojank          = { module = "me.senseiwells:mojank"                                 , version.ref = "mojank" }
casual-database = { module = "net.casualchampionships:casual-database"               , version.ref = "casual-database" }

ktor-cio           = { module = "io.ktor:ktor-client-cio"                , version.ref = "ktor"}
ktor-core          = { module = "io.ktor:ktor-client-core-jvm"           , version.ref = "ktor"}
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor"}
ktor-negotiation   = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor"}

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow               = { id = "com.gradleup.shadow", version.ref = "shadow" }